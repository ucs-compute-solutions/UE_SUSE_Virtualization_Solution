search --no-floppy --file --set=root /boot/kernel.xz
set default=0
set timeout=600
set timeout_style=menu
set linux=linux
set initrd=initrd

source (${root})/boot/grub2/harvester.cfg

if [ "${grub_cpu}" = "x86_64" -o "${grub_cpu}" = "i386" ];then
    if [ "${grub_platform}" = "efi" ]; then
        set linux=linuxefi
        set initrd=initrdefi
    fi
fi
if [ "${grub_platform}" = "efi" ]; then
    echo "Please press 't' to show the boot menu on this console"
fi
set font=($root)/boot/x86_64/loader/grub2/fonts/unicode.pf2
if [ -f ${font} ];then
    loadfont ${font}
fi
menuentry "Harvester Installer ${harvester_version}" --class os --unrestricted {
    echo Loading kernel...
    $linux ($root)/boot/x86_64/loader/linux cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs console=tty1 rd.cos.disable net.ifnames=1
    echo Loading initrd...
    $initrd ($root)/boot/x86_64/loader/initrd
}

menuentry "Harvester Installer ${harvester_version} with harvester.cfg" --class os --unrestricted {
    echo Loading kernel...
    $linux ($root)/boot/x86_64/loader/linux cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs console=tty1 rd.cos.disable net.ifnames=1 ${extra_iso_cmdline}
    echo Loading initrd...
    $initrd ($root)/boot/x86_64/loader/initrd
}

menuentry "node1 - Harvester Installer ${harvester_version}" --class os --unrestricted {
    echo Loading kernel...
    $linux ($root)/boot/x86_64/loader/linux cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs console=tty1 rd.cos.disable net.ifnames=1 rd.neednet=1 ip=10.132.0.11::10.132.0.254:255.255.255.0:harvester1:1320:none nameserver=192.168.160.53 bond=bond0:eno1np0,eno2np1:mode=active-backup,miimon=100 vlan=1320:bond0 net.ifnames=1 rd.noverifyssl console=tty1 harvester.install.automatic=true harvester.install.config_url=http://192.168.160.29/harvester/harvester1.yaml
    echo Loading initrd...
    $initrd ($root)/boot/x86_64/loader/initrd
}

